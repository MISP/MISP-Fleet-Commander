x-mfc-common: &mfc-common
    build:
        context: .
        dockerfile: backend/docker/Dockerfile
    working_dir: /app
    environment: &mfc-env
        FLASK_APP: wsgi.py
        FLASK_DEBUG: "0"
        FLASK_CONFIG: config.ProductionConfig
        SQLALCHEMY_DATABASE_URI: /app/database/database.db
        SQLALCHEMY_TRACK_MODIFICATIONS: "1"
        # SECRET_KEY: set it to override the key generated in ./run/secret_key
        TOKEN_EXPIRATION_MIN: "30"
        REDIS_URL: redis
        REDIS_PORT: "6379"
        REDIS_DB: "1"
        SOCKETIO_MESSAGE_QUEUE: redis://redis:6379/3
        WORKER_BROKER_URL: redis://redis
        WORKER_RESULT_BACKEND: redis://redis
        # Optional monitoring (InfluxDB + Grafana), read from the environment or a .env file
        INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-}
        INFLUXDB_URL: ${INFLUXDB_URL:-}
        INFLUXDB_ORG: ${INFLUXDB_ORG:-}
        INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-}
        GRAFANA_APIKEY: ${GRAFANA_APIKEY:-}
        GRAFANA_BASE_URL: ${GRAFANA_BASE_URL:-}
        GRAFANA_DASHBOARD_DATA_RENDER: ${GRAFANA_DASHBOARD_DATA_RENDER:-}
        GRAFANA_DASHBOARD: ${GRAFANA_DASHBOARD:-}
    volumes:
        - "./run:/app/database"
        - "./run/data:/app/data"
    restart: unless-stopped

services:
    backend:
        <<: *mfc-common
        environment:
            <<: *mfc-env
            MFC_RUN_MIGRATIONS: "1"
        command: flask run --port=5001 --host=0.0.0.0
        ports:
            - "5001:5001"
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/', timeout=3)"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 15s
        depends_on:
            redis:
                condition: service_healthy

    workers:
        <<: *mfc-common
        command: huey_consumer application.workers.tasks.huey_app -w 4 -k process
        depends_on:
            redis:
                condition: service_healthy
            backend:
                condition: service_healthy

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 5s
            timeout: 3s
            retries: 10
